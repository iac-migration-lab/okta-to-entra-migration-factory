# Reusable change gate (docs/change-gate-design.md). Called by plan.yml (with the PR number), apply.yml
# (PR resolved from the merge commit) and okta-cutover.yml (change named in the run inputs). Lab adapter: GitHub Issues; a real ITSM is another adapter in the script.
name: change-gate

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number; empty means "find the PR for this commit"
        type: string
        default: ""
      change_ref:
        description: Change record for a run with no PR, e.g. github:17 (okta-cutover.yml)
        type: string
        default: ""

permissions:
  issues: read # read the change issue
  pull-requests: read # read the PR body (and find the PR for a merge commit)

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check change record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHANGE_REF: ${{ inputs.change_ref }}
          SHA: ${{ github.sha }}
        run: .github/scripts/change-gate.sh
