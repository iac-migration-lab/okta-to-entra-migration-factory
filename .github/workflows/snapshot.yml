# Nightly read-only snapshot of the lab Okta org (Lab Phase 1).
# terraform plan -detailed-exitcode against okta-inventory/: 0 = no drift (green), 2 = drift (red, plan in the summary).
# Counts are committed to docs/inventory-counts.md on branch inventory-counts (main is protected; the bot cannot push there).
# User and assignment JSON go to Azure Blob okta-exports only.
name: snapshot

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC, 03:17 MDT
  workflow_dispatch:

permissions:
  id-token: write # Azure federated credential (iac-reader)
  contents: write # commit inventory counts

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    environment: okta-read
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      OKTA_ORG_URL: https://integrator-2631921.okta.com
      OKTA_CLIENT_ID: ${{ vars.OKTA_CLIENT_ID }}
      OKTA_KEY_ID: ${{ vars.OKTA_KEY_ID }}
      OKTA_API_PRIVATE_KEY_ID: ${{ vars.OKTA_KEY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # iac-reader has data roles on two containers only

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Okta private key to a temp file
        env:
          OKTA_PRIVATE_KEY: ${{ secrets.OKTA_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OKTA_PRIVATE_KEY" > "$RUNNER_TEMP/okta-reader.pem"
          echo "OKTA_API_PRIVATE_KEY=$RUNNER_TEMP/okta-reader.pem" >> "$GITHUB_ENV"
          echo "OKTA_PRIVATE_KEY_FILE=$RUNNER_TEMP/okta-reader.pem" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: okta-inventory
        run: terraform init -input=false -no-color

      - name: terraform plan
        id: plan
        working-directory: okta-inventory
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Okta snapshot: plan exit $code"
            case $code in 0) echo "No drift." ;; 2) echo "**Drift detected.** Okta differs from okta-inventory/." ;; *) echo "**Plan failed.**" ;; esac
            echo; echo '```'; grep -vE '^\s*$' "$RUNNER_TEMP/plan.txt" | tail -n 150; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $code -eq 0 || $code -eq 2 ]]

      - name: Export counts and personal data
        env:
          COUNTS_FILE: docs/inventory-counts.md
          EXPORT_DIR: ${{ runner.temp }}/okta-export
        run: okta-inventory/snapshot-export.sh

      - name: Upload personal data to Blob (never Git)
        run: |
          az storage blob upload-batch --auth-mode login --account-name stiaclabtfstate02 \
            --destination okta-exports --destination-path "$(date -u +%Y-%m-%d)/${GITHUB_RUN_ID}" \
            --source "$RUNNER_TEMP/okta-export" --overwrite false --no-progress -o none
          rm -rf "$RUNNER_TEMP/okta-export"

      - name: Commit counts to branch inventory-counts if changed
        # main requires PR checks, which GITHUB_TOKEN cannot satisfy; inventory-counts is unprotected and holds only this file.
        run: |
          cp docs/inventory-counts.md "$RUNNER_TEMP/counts.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin inventory-counts; then
            git checkout -f -B inventory-counts FETCH_HEAD
          else
            git checkout -f --orphan inventory-counts && git rm -rfq .
          fi
          mkdir -p docs && cp "$RUNNER_TEMP/counts.md" docs/inventory-counts.md
          git add docs/inventory-counts.md
          if git diff --cached --quiet; then echo "Counts unchanged."; exit 0; fi
          git commit -m "snapshot: inventory counts changed (run ${GITHUB_RUN_ID})"
          git push origin inventory-counts

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/okta-reader.pem"

      - name: Fail on drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error title=Okta drift::terraform plan exit 2; see the job summary"
          exit 1
